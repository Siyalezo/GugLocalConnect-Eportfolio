<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GugsLocalConnect - Digital E-Portfolio</title>
  <!-- GitHub Markdown CSS for clean formatting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 1000px;
      margin: 0 auto;
      padding: 45px;
      background-color: #0d1117;
    }
    .markdown-body img {
      max-width: 100%;
      border-radius: 6px;
      border: 1px solid #30363d;
      margin: 15px 0;
    }
  </style>
</head>
<body class="markdown-body">
  <div id="content">Loading digital portfolio...</div>

  <!-- Marked.js parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    fetch('README.md')
      .then(response => {
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        return response.text();
      })
      .then(text => {
        document.getElementById('content').innerHTML = marked.parse(text);
      })
      .catch(error => {
        document.getElementById('content').innerHTML = '<h2>Error loading README.md</h2><p>Please ensure README.md exists in the root repository folder.</p>';
      });
  </script>
</body>
</html>
